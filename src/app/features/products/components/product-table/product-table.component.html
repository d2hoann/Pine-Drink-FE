<div class="table-card card-surface">
  <div class="table-scroll" *ngIf="products.length > 0; else emptyBlock">
    <table>
      <thead>
        <tr>
          <th>Mã</th>
          <th>Tên</th>
          <th>Danh mục</th>
          <th>Giá</th>
          <th>Trạng thái</th>
          <th class="actions-col">Thao tác</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products; trackBy: trackById">
          <td>{{ product.code }}</td>
          <td>
            <strong>{{ product.name }}</strong>
          </td>
          <td>{{ product.categoryName || 'Chưa phân loại' }}</td>
          <td>{{ product.price | number }} VND</td>
          <td><span class="status-chip" [class.inactive]="product.status === 'INACTIVE'">{{ product.status | businessLabel:'product' }}</span></td>
          <td class="actions-col">
            <button type="button" class="btn btn-secondary btn-small" (click)="edit.emit(product.id)">Sửa</button>
            <button type="button" class="btn btn-danger btn-small" (click)="delete.emit(product.id)">Xóa</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #emptyBlock>
    <app-empty-state title="Chưa có sản phẩm" description="Tạo sản phẩm đầu tiên hoặc thử bộ lọc khác."></app-empty-state>
  </ng-template>
</div>
